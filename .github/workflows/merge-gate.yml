name: merge gate (full suite)

# The merge queue's required check. The queue builds the candidate merge of a PR onto the
# current main, runs the WHOLE suite — including the in-process page-render tests — on that
# candidate, and fast-forwards main only when this is green. So a red tree can never land, and
# what lands is exactly what was validated (branch + the main it merges onto). Also runs on PRs
# for early feedback.

on:
  pull_request:
    branches: [main]
  merge_group:

# A pull_request run supersedes its own predecessor on the same PR, so a new push cancels the run
# that is still testing the commit before it. github.event_name is in the key so that flag can
# never reach a merge_group run: a cancelled candidate reads to the queue as a failed required
# check and would drop the PR. Candidates and their unique SHAs get a group of their own and so
# never queue behind anything.
concurrency:
  group: merge-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint gate (same checks as bin/lint; pinned ruff so format-check matches local)
        run: |
          python -m ruff check rtt tools
          python -m ruff format --check rtt tools
          python -m tools.quality_checks rtt tools
      # --dist loadfile keeps every test in a file on one worker, in file order. The render tests'
      # module-scoped `default_page` fixture builds one page per file; any mode that splits a file
      # (load, loadscope) rebuilds it per worker instead, which is both slower and reorders tests
      # against fixtures that outlive them.
      - name: Run the full suite (library + app + render)
        run: python -m pytest -q -n auto --dist loadfile

  # The client-JS gate. The full suite above runs in-process and executes ZERO browser JavaScript, so
  # a regression in assets/*.js (or the inline scripts in page_assets.py) sails through it. This job
  # drives real Chrome (and Firefox, for the cross-engine cell-sizing fallback) via Playwright with
  # RTT_BROWSER_SMOKE=1, so the scripts' behavior is gated on every merge. Kept a SEPARATE job so its
  # browser install never slows the main suite. It IS a required check on the ruleset now — for the
  # first three weeks of the queue it was not, so it ran on every candidate and blocked nothing, and
  # a client-JS regression could land green. A job that is not in required_status_checks is advisory
  # however loudly it fails. It runs single-process: the browser files serve the app on fixed ports,
  # which two concurrent workers would collide on.
  browser-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chrome and Firefox for Playwright
        run: python -m playwright install --with-deps chrome firefox
      - name: Run the real-browser suite (client JS)
        env:
          RTT_BROWSER_SMOKE: "1"
        run: |
          python -m pytest -q \
            tests/app/integration/test_browser_smoke.py \
            tests/app/integration/test_browser_behavior.py \
            tests/app/integration/test_browser_score.py \
            tests/app/integration/test_browser_drag_select.py \
            tests/app/integration/test_browser_cell_sizing.py
