name: ci experiment (TEMPORARY — delete before landing)

on:
  push:
    branches: ["claude/silly-herschel-**"]

jobs:
  measure:
    name: ${{ matrix.arm }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: A-control-serial
            runner: ubuntu-latest
            flags: ""
            threads: ""
          - arm: B-serial-threadpinned
            runner: ubuntu-latest
            flags: ""
            threads: "1"
          - arm: C-xdist-nopin
            runner: ubuntu-latest
            flags: "-n auto --dist loadfile"
            threads: ""
          - arm: D-xdist-threadpinned
            runner: ubuntu-latest
            flags: "-n auto --dist loadfile"
            threads: "1"
          - arm: E-ubuntu2204-serial
            runner: ubuntu-22.04
            flags: ""
            threads: ""
          - arm: F-arm64-xdist-threadpinned
            runner: ubuntu-24.04-arm
            flags: "-n auto --dist loadfile"
            threads: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Runner hardware facts
        run: |
          echo "arm=${{ matrix.arm }} runner=${{ matrix.runner }} arch=$RUNNER_ARCH"
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc
          python -c 'import os; print("cpu_count", os.cpu_count(), "affinity", len(os.sched_getaffinity(0)))'
          grep -E '^(MemTotal|MemAvailable|SwapTotal)' /proc/meminfo
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket|BogoMIPS)'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Numeric backend
        run: python -c "import numpy; numpy.show_config()"
      - name: Run the full suite
        run: |
          if [ -n "${{ matrix.threads }}" ]; then
            export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          fi
          echo "OMP_NUM_THREADS=${OMP_NUM_THREADS:-<unset>}"
          python -m pytest -q ${{ matrix.flags }} --durations=25
      - name: Peak memory and load after the run
        if: always()
        run: |
          grep -E '^(MemTotal|MemAvailable)' /proc/meminfo
          cat /proc/loadavg
